# The benchmark.
#
# Two packages, one question between them: given an image and a problem, how
# good is it?
#
#   imagent_bench    generates problems and the answer keys that grade them.
#                    Stdlib-only, because it is pinned inside an attested TEE
#                    image and must produce identical problems there and here.
#   imagent_scoring  grades an image against an answer key, and judges two
#                    images head to head.
#
# Nothing here knows what a crown is. The competition lives in gt-imagent.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagent-bench"
version = "0.2.0"
description = "Problem generation and objective scoring for the Imagent benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# The core is deliberately dependency-free: the rules a miner is judged by should
# be readable and re-derivable without installing anything.
dependencies = []

[project.optional-dependencies]
# The image backends. This is the one place third-party code is allowed, and it
# is the validator's own infrastructure — a candidate never executes it.
scoring = [
  "pillow>=10.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pillow>=10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
